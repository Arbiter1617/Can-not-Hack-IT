<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Infinite Heart — Music</title>
<link rel="stylesheet" href="style.css">
<style>
  .slider-row{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    width: 420px;
    padding: 1rem 0;
    border-radius: 14px;
  }
  .slider-row.active{
    box-shadow: none;
  }
  .slider-label-row{
    display: flex;
    justify-content: space-between;
    width: 100%;
    font-size: 1rem;
    letter-spacing: 0.05em;
  }
  .slider-name{ color: rgba(217, 249, 255, 0.6); }
  .slider-row.active .slider-name{
    color: var(--neon);
    text-shadow: var(--glow-sm);
  }
  .slider-pct{ color: var(--neon); min-width: 3.5em; text-align: right; }

  .slider-track-wrap{
    position: relative;
    width: 100%;
    height: 28px;
    display: flex;
    align-items: center;
  }
  .slider-track{
    position: relative;
    width: 100%;
    height: 4px;
    background: rgba(41, 226, 255, 0.18);
    border-radius: 999px;
  }
  .slider-fill{
    position: absolute;
    top: 0; left: 0; bottom: 0;
    background: var(--neon);
    border-radius: 999px;
    box-shadow: var(--glow-sm);
  }
  .slider-handle{
    position: absolute;
    top: 50%;
    width: 16px;
    height: 16px;
    background: var(--neon);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: var(--glow-sm);
    cursor: grab;
  }
  .slider-row.active .slider-handle{
    box-shadow: var(--glow-lg);
  }
  .slider-handle:active{ cursor: grabbing; }

  .toggle-switch {
    position: relative;
    width: 44px;
    height: 22px;
    background: rgba(41, 226, 255, 0.15);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .toggle-switch.on {
    background: rgba(41, 226, 255, 0.4);
    box-shadow: var(--glow-sm);
  }
  .toggle-knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    background: var(--neon);
    border-radius: 50%;
    transition: transform 0.25s cubic-bezier(0.4, 0.0, 0.2, 1);
  }
  .toggle-switch.on .toggle-knob {
    transform: translateX(22px);
    background: #fff;
    box-shadow: var(--glow-sm);
  }
  .slider-row.active .toggle-knob {
    box-shadow: var(--glow-lg);
  }
</style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <button class="back-button">← Back</button>

  <div class="page">
    <h1 class="page-title">Music</h1>
    <div id="slider-stack" style="display:flex; flex-direction:column; gap:0.6rem; align-items:center;"></div>
    <div class="hint">W / S to move &nbsp;·&nbsp; A / D / drag to adjust &nbsp;·&nbsp; Esc to go back</div>
  </div>

  <script src="background.js"></script>
  <script src="audio.js"></script>
  <script src="subpage.js"></script>
  <script src="music.js"></script>
</body>
</html>
