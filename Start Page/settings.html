<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Infinite Heart — Settings</title>
<link rel="stylesheet" href="style.css">
<style>
  .keybind-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2.5rem;
    width: 360px;
  }
  .keybind-name{ flex: 1; text-align: left; }
  .keybind-key{
    min-width: 64px;
    text-align: center;
    padding: 0.25rem 0.7rem;
    border: 1px solid var(--neon-soft);
    border-radius: 8px;
    font-size: 0.95rem;
    color: var(--neon);
    text-shadow: var(--glow-sm);
  }
  .menu-item.listening .keybind-key{
    color: #fff;
    border-color: #fff;
    animation: pulse 0.9s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.35; }
  }
  #reset-row{ margin-top: 0.6rem; }
  #time-played{
    margin-top: 2.2rem;
    color: rgba(217, 249, 255, 0.4);
    font-size: 0.9rem;
    letter-spacing: 0.05em;
  }
  #time-played span{ color: var(--neon); }
</style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <button class="back-button">← Back</button>

  <div class="page">
    <h1 class="page-title">Settings</h1>
    <ul class="menu-list" id="keybind-list"></ul>
    <div id="time-played">Total Time Played: <span id="time-played-value">00:00:00</span></div>
    <div class="hint">W / S to move &nbsp;·&nbsp; Enter to toggle &nbsp;·&nbsp; Esc to go back</div>
  </div>

  <script src="background.js"></script>
  <script src="audio.js"></script>
  <script src="subpage.js"></script>
  <script src="settings.js"></script>
</body>
</html>
