<!--
  ╔══════════════════════════════════════════════════════════╗
  ║  INFINITE HEART — Script Load Order                     ║
  ║                                                          ║
  ║  CORE (load first — shared globals)                     ║
  ║    constants.js  → HEART_R, GRAZE_R, score, rnd, clamp ║
  ║    canvas.js     → canvas, ctx, resize()                ║
  ║    input.js      → Keys, Mouse                          ║
  ║    clock.js      → LoopClock                            ║
  ║    pool.js       → BulletPool                           ║
  ║    particles.js  → Particles                            ║
  ║    indicators.js → IndicatorSystem                      ║
  ║    heart.js      → drawHeart()                          ║
  ║                                                          ║
  ║  ARCHITECTURE                                            ║
  ║    hell-base.js  → HellBase (abstract)                  ║
  ║                                                          ║
  ║  HELLS (one file per hell — add new ones here)          ║
  ║    hells/dodge-hell.js   → DodgeHell  (Hell #1)        ║
  ║    hells/shield-hell.js  → ShieldHell (Hell #2) [TODO] ║
  ║    hells/string-hell.js  → StringHell (Hell #3) [TODO] ║
  ║    ... etc                                               ║
  ║                                                          ║
  ║  ORCHESTRATION (load last)                               ║
  ║    director.js   → GameDirector (register hells here)   ║
  ║    main.js       → boot + game loop                     ║
  ╚══════════════════════════════════════════════════════════╝
-->
