<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Heart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    canvas { display: block; cursor: none; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════
// INFINITE HEART — Full Rewrite v2.0
// Architecture: Director → HellBase → BulletPool + delta-time loop
// ═══════════════════════════════════════════════════════════════════

// ─── Canvas ─────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ─── Input ──────────────────────────────────────────────────────────
const Keys  = {};
const Mouse = { x: 0, y: 0, prevX: 0, prevY: 0, trail: [] };
window.addEventListener('keydown', e => { Keys[e.code] = true;  e.preventDefault(); });
window.addEventListener('keyup',   e => { Keys[e.code] = false; });
window.addEventListener('mousemove', e => {
  Mouse.prevX = Mouse.x; Mouse.prevY = Mouse.y;
  Mouse.x = e.clientX;   Mouse.y = e.clientY;
  Mouse.trail.push({ x: Mouse.x, y: Mouse.y, t: performance.now() });
  if (Mouse.trail.length > 24) Mouse.trail.shift();
});

// ─── Global Constants ───────────────────────────────────────────────
const HEART_R          = 8;    // lethal hitbox radius
const GRAZE_R          = 22;   // outer graze ring
const BASE_SPEED       = 250;  // px/s
const FOCUS_MULT       = 0.45;
const HELL_SCORE_STEP  = 3000; // score threshold per hell transition
const SCORE_PER_SEC    = 100;  // passive score gain

let score = 0;

// ─── Utility ────────────────────────────────────────────────────────
const rnd  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const TWO_PI = Math.PI * 2;

// ═══════════════════════════════════════════════════════════════════
// LOOP CLOCK  (timer = health)
// ═══════════════════════════════════════════════════════════════════
class LoopClock {
  constructor(start = 60) {
    this.time    = start;
    this.maxTime = start;
    this.floats  = [];
  }

  add(secs, x, y) {
    this.time = Math.min(this.time + secs, this.maxTime + 30);
    this.floats.push({ text: '+' + secs + 's', x, y, color: '#00ff88', life: 1.3 });
  }

  subtract(secs, x, y) {
    this.time = Math.max(this.time - secs, 0);
    this.floats.push({ text: '−' + secs + 's', x, y, color: '#ff4444', life: 1.3 });
  }

  update(dt) {
    this.time = Math.max(this.time - dt, 0);
    for (const f of this.floats) { f.life -= dt; f.y -= 38 * dt; }
    this.floats = this.floats.filter(f => f.life > 0);
  }

  get dead() { return this.time <= 0; }

  draw(ctx, W) {
    const bW = W * 0.55, bX = (W - bW) / 2, bY = 14, bH = 10;
    const ratio = clamp(this.time / this.maxTime, 0, 1);
    const col   = ratio > 0.5 ? '#00cc66' : ratio > 0.25 ? '#ffaa00' : '#ff3333';

    // Bar background
    ctx.fillStyle = '#111'; ctx.fillRect(bX, bY, bW, bH);
    // Bar fill
    ctx.fillStyle = col;    ctx.fillRect(bX, bY, bW * ratio, bH);
    // Bar border
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
    ctx.strokeRect(bX, bY, bW, bH);
    // Time label
    ctx.fillStyle = '#ccc'; ctx.font = '11px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillText(Math.ceil(this.time) + 's', W / 2, bY + bH + 14);
    ctx.textAlign = 'left';

    // Floating time text
    for (const f of this.floats) {
      ctx.globalAlpha = clamp(f.life, 0, 1);
      ctx.fillStyle = f.color;
      ctx.font = 'bold 14px "Courier New"';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';

    // Screen pulse when < 10s
    if (this.time < 10) {
      const pulse = Math.abs(Math.sin(performance.now() / 180)) * 0.07;
      ctx.fillStyle = `rgba(255,0,0,${pulse})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }
}

// ═══════════════════════════════════════════════════════════════════
// BULLET POOL
// ═══════════════════════════════════════════════════════════════════
class BulletPool {
  constructor(cap = 900) {
    this.list = Array.from({ length: cap }, () => this._blank());
  }

  _blank() {
    return {
      active: false, x: 0, y: 0, vx: 0, vy: 0, r: 6,
      color: '#fff', life: 8,
      grazed: false, hit: false,
      trail: [], age: 0,
      // for bounce
      bounceX: false, bounceY: false, bndRef: null,
      // for growth near boundary
      growNear: false, baseR: 6, baseVx: 0, baseVy: 0,
    };
  }

  spawn(o) {
    const b = this.list.find(b => !b.active);
    if (!b) return null;
    Object.assign(b, this._blank(), {
      active: true, ...o,
      trail: [], age: 0, grazed: false, hit: false,
      baseR:  o.r  || 6,
      baseVx: o.vx || 0,
      baseVy: o.vy || 0,
    });
    return b;
  }

  update(dt, hx, hy, clock, iframed, cfg) {
    let gotHit = false;
    const W = canvas.width, H = canvas.height;
    for (const b of this.list) {
      if (!b.active) continue;
      b.age  += dt;
      b.life -= dt;

      // Trail
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 9) b.trail.shift();

      // Bounce off boundary walls
      if (b.bounceX && b.bndRef) {
        if (b.x - b.r < b.bndRef.x || b.x + b.r > b.bndRef.x + b.bndRef.w) b.vx *= -1;
      }
      if (b.bounceY && b.bndRef) {
        if (b.y - b.r < b.bndRef.y || b.y + b.r > b.bndRef.y + b.bndRef.h) b.vy *= -1;
      }

      // Growth + slow near boundary (Shooter Hell enemy shots)
      if (b.growNear && b.bndRef) {
        const d = Math.min(b.x - b.bndRef.x, b.bndRef.x + b.bndRef.w - b.x,
                           b.y - b.bndRef.y, b.bndRef.y + b.bndRef.h - b.y);
        if (d < 90) {
          const t = 1 - clamp(d / 90, 0, 1);
          b.r  = b.baseR  * (1 + t * 0.5);
          b.vx = b.baseVx * (1 - t * 0.45);
          b.vy = b.baseVy * (1 - t * 0.45);
        }
      }

      b.x += b.vx * dt;
      b.y += b.vy * dt;

      // Expire
      if (b.life <= 0 || b.x < -80 || b.x > W + 80 || b.y < -80 || b.y > H + 80) {
        b.active = false; continue;
      }

      if (iframed) continue;

      const dx = b.x - hx, dy = b.y - hy, dist = Math.hypot(dx, dy);

      // Graze
      if (!b.grazed && dist < GRAZE_R && dist >= HEART_R + b.r - 2) {
        b.grazed = true;
        if (cfg.grazeGain > 0) clock.add(cfg.grazeGain, hx, hy - 24);
      }
      // Hit
      if (!b.hit && dist < HEART_R + b.r - 3) {
        b.hit = true; b.active = false;
        clock.subtract(cfg.hitPenalty, hx, hy - 24);
        gotHit = true;
      }
    }
    return gotHit;
  }

  draw(ctx) {
    for (const b of this.list) {
      if (!b.active) continue;
      // Trail
      for (let i = 0; i < b.trail.length; i++) {
        ctx.globalAlpha = (i / b.trail.length) * 0.28;
        ctx.fillStyle   = b.color;
        ctx.beginPath();
        ctx.arc(b.trail[i].x, b.trail[i].y, b.r * (i / b.trail.length) * 0.7, 0, TWO_PI);
        ctx.fill();
      }
      ctx.globalAlpha   = 1;
      ctx.shadowBlur    = 12;
      ctx.shadowColor   = b.color;
      ctx.fillStyle     = b.color;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TWO_PI);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }

  clear() { for (const b of this.list) b.active = false; }
}

// ═══════════════════════════════════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════════════════════════════════
class Particles {
  constructor() { this.list = []; }

  burst(x, y, color, n = 14, spd = 180) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TWO_PI), s = spd * rnd(0.4, 1.1);
      this.list.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
        r: rnd(2, 4), color, life: rnd(0.5, 1) });
    }
  }

  update(dt) {
    for (const p of this.list) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.91;     p.vy *= 0.91;
      p.life -= dt;
    }
    this.list = this.list.filter(p => p.life > 0);
  }

  draw(ctx) {
    for (const p of this.list) {
      ctx.globalAlpha = clamp(p.life, 0, 1);
      ctx.fillStyle   = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TWO_PI); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

// ═══════════════════════════════════════════════════════════════════
// INDICATOR SYSTEM  (flash + ! + flicker before spawn)
// ═══════════════════════════════════════════════════════════════════
class IndicatorSystem {
  constructor() { this.list = []; }

  add(x, y, dur = 0.75) {
    this.list.push({ x, y, life: dur, maxLife: dur });
  }

  update(dt) {
    for (const i of this.list) i.life -= dt;
    this.list = this.list.filter(i => i.life > 0);
  }

  draw(ctx) {
    for (const ind of this.list) {
      const t       = 1 - ind.life / ind.maxLife;
      const flicker = Math.sin(t * Math.PI * 14) > 0;
      if (!flicker && t < 0.65) continue;
      ctx.globalAlpha = clamp(ind.life / ind.maxLife, 0, 0.9);
      // Expanding ring
      ctx.beginPath();
      ctx.arc(ind.x, ind.y, 8 + t * 10, 0, TWO_PI);
      ctx.strokeStyle = '#ff4422'; ctx.lineWidth = 2; ctx.stroke();
      // Exclamation
      ctx.fillStyle = '#ff4422';
      ctx.font = 'bold 15px "Courier New"';
      ctx.textAlign = 'center';
      ctx.fillText('!', ind.x, ind.y - 14);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
}

// ═══════════════════════════════════════════════════════════════════
// HEART DRAWING
// ═══════════════════════════════════════════════════════════════════
function drawHeart(ctx, x, y, size, color, upsideDown = false) {
  // Heart centred at (x, y).
  // Path verified: top of lobes ≈ -size*0.9, bottom tip = +size  → centre ≈ size*0.05 ≈ 0
  const h = size, w = size * 0.9;
  ctx.save();
  ctx.translate(x, y);
  if (upsideDown) ctx.scale(1, -1);

  ctx.shadowBlur = 22; ctx.shadowColor = color;
  ctx.fillStyle  = color;
  ctx.beginPath();
  ctx.moveTo(0, h);                                          // bottom tip
  ctx.bezierCurveTo(-w*0.1,  h*0.5, -w*1.3,  h*0.1, -w,  -h*0.2);  // left outer
  ctx.bezierCurveTo(-w*0.7, -h*0.9,  0,      -h*0.7,  0,  -h*0.4);  // left lobe top → dip
  ctx.bezierCurveTo( 0,     -h*0.7,  w*0.7,  -h*0.9,  w,  -h*0.2);  // right lobe top
  ctx.bezierCurveTo( w*1.3,  h*0.1,  w*0.1,   h*0.5,  0,   h);      // right outer → tip
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;

  // Lethal hitbox ring — white, at (0,0) = collision centre
  ctx.beginPath();
  ctx.arc(0, 0, HEART_R, 0, TWO_PI);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth   = 1.5;
  ctx.stroke();

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════
// HELL BASE
// ═══════════════════════════════════════════════════════════════════
class HellBase {
  constructor(dir) {
    this.dir        = dir;
    this.pool       = dir.pool;
    this.clock      = dir.clock;
    this.particles  = dir.particles;
    this.indicators = dir.indicators;
  }
  get heartColor()    { return '#ff3333'; }
  get heartUpsideDown() { return false; }
  get boundary()      { return null; } // {x,y,w,h} | null = full screen
  get cfg()           { return { grazeGain: 1, hitPenalty: 6 }; }
  enter() {}
  exit()  { this.pool.clear(); }
  update(dt) {}
  draw(ctx) {}
}

// ═══════════════════════════════════════════════════════════════════
// HELL 1 — DODGE HELL
// ═══════════════════════════════════════════════════════════════════
class DodgeHell extends HellBase {
  constructor(dir) {
    super(dir);
    this.pIdx      = 0;
    this.pTimer    = 0;
    this.pDur      = 10;     // seconds per pattern
    this.fireTimer = 0;
    this.spiralAng = 0;
    this._deferred = [];     // pending spawn callbacks
    this.PATTERNS  = [
      this._spread.bind(this),
      this._ring.bind(this),
      this._cross.bind(this),
      this._spiral.bind(this),
      this._aimed.bind(this),
      this._wallGap.bind(this),
    ];
  }

  get heartColor() { return '#ff3333'; }
  get cfg()        { return { grazeGain: 1, hitPenalty: 6 }; }

  get boundary() {
    const W = canvas.width, H = canvas.height;
    const sz = Math.min(W, H) * 0.88;
    return { x: (W - sz) / 2, y: (H - sz) / 2, w: sz, h: sz };
  }

  _bnd() { return this.boundary; }

  get _fireRate() {
    // Fire rate gets faster as score climbs (max 2× speed at score 24000)
    return 0.82 - clamp(score / 24000, 0, 1) * 0.42;
  }

  enter() {
    this.fireTimer = 0;
    this.spiralAng = 0; this._deferred = [];
  }

  exit() {
    super.exit();
    for (const d of this._deferred) clearTimeout(d.id);
    this._deferred = [];
  }

  _defer(ms, fn) {
    const id = setTimeout(() => {
      if (this.dir.currentHell !== this) return;
      fn();
    }, ms);
    this._deferred.push({ id });
  }

  update(dt) {
    this.spiralAng += dt * 1.9;
    this.fireTimer += dt;

    if (this.fireTimer >= this._fireRate) {
      this.fireTimer = 0;
      // Pick a random pattern — wall+gap fires at low rate to give breathe room
      const roll = Math.random();
      if (roll < 0.08) {
        this._wallGap();           // ~8% chance — wall has its own longer indicator
      } else {
        // Pick randomly from the other 5 patterns
        const fast = [this._spread, this._ring, this._cross, this._spiral, this._aimed];
        fast[Math.floor(Math.random() * fast.length)].call(this);
      }
    }
  }

  draw(ctx) {
    const b = this._bnd();
    ctx.strokeStyle = 'rgba(255,50,50,0.12)';
    ctx.lineWidth   = 1;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  }

  // ── Pattern A: Spread Shot ──────────────────────────────────────
  _spread() {
    const b = this._bnd();
    const sides = ['L','R','T','B'];
    const side  = sides[Math.floor(Math.random() * 4)];
    let sx, sy;
    if (side === 'L') { sx = b.x;       sy = rnd(b.y, b.y + b.h); }
    if (side === 'R') { sx = b.x + b.w; sy = rnd(b.y, b.y + b.h); }
    if (side === 'T') { sy = b.y;       sx = rnd(b.x, b.x + b.w); }
    if (side === 'B') { sy = b.y + b.h; sx = rnd(b.x, b.x + b.w); }
    this.indicators.add(sx, sy);
    this._defer(700, () => {
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      const base = Math.atan2(cy - sy, cx - sx);
      const spread = Math.PI / 4.5, n = 7;
      const spd = 155 + clamp(score / 300, 0, 75);
      for (let i = 0; i < n; i++) {
        const a = base - spread/2 + (spread/(n-1))*i;
        this.pool.spawn({ x: sx, y: sy,
          vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
          r: 7, color: '#ff6655', life: 6 });
      }
    });
  }

  // ── Pattern B: Ring Burst ───────────────────────────────────────
  _ring() {
    const b = this._bnd();
    const cx = b.x + b.w * rnd(0.2, 0.8);
    const cy = b.y + b.h * rnd(0.2, 0.8);
    this.indicators.add(cx, cy, 0.6);
    this._defer(600, () => {
      const n = 12, spd = 138 + clamp(score / 400, 0, 60);
      for (let i = 0; i < n; i++) {
        const a = (TWO_PI * i) / n;
        this.pool.spawn({ x: cx, y: cy,
          vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
          r: 6, color: '#ff88bb', life: 6 });
      }
    });
  }

  // ── Pattern C: Cross ────────────────────────────────────────────
  _cross() {
    const b    = this._bnd();
    const spd  = 150 + clamp(score / 350, 0, 70);
    const gap  = 55 + Math.random() * 35;
    const midX = b.x + b.w / 2;
    const rowY = b.y + b.h * rnd(0.25, 0.75);
    const step = 32;
    const cols = Math.floor(b.w / step);
    for (let i = 0; i < cols; i++) {
      const bx = b.x + i * step + step / 2;
      if (Math.abs(bx - midX) < gap / 2) continue;
      this.indicators.add(bx, rowY, 0.7);
    }
    this._defer(700, () => {
      for (let i = 0; i < cols; i++) {
        const bx = b.x + i * step + step / 2;
        if (Math.abs(bx - midX) < gap / 2) continue;
        this.pool.spawn({ x: bx, y: rowY, vx: 0, vy:  spd, r: 8, color: '#88aaff', life: 6 });
        this.pool.spawn({ x: bx, y: rowY, vx: 0, vy: -spd, r: 8, color: '#88aaff', life: 6 });
      }
    });
  }

  // ── Pattern D: Spiral ───────────────────────────────────────────
  _spiral() {
    const b   = this._bnd();
    const cx  = b.x + b.w / 2, cy = b.y + b.h / 2;
    const spd = 170 + clamp(score / 300, 0, 80);
    const arms = 3;
    for (let i = 0; i < arms; i++) {
      const a = this.spiralAng + (TWO_PI * i) / arms;
      this.pool.spawn({ x: cx, y: cy,
        vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
        r: 6, color: '#ffcc44', life: 5 });
    }
  }

  // ── Pattern E: Aimed Shot ───────────────────────────────────────
  _aimed() {
    const b    = this._bnd();
    const hx   = this.dir.hx, hy = this.dir.hy;
    const sides = ['L','R','T','B'];
    const side  = sides[Math.floor(Math.random() * 4)];
    let sx, sy;
    if (side === 'L') { sx = b.x;       sy = rnd(b.y, b.y + b.h); }
    if (side === 'R') { sx = b.x + b.w; sy = rnd(b.y, b.y + b.h); }
    if (side === 'T') { sy = b.y;       sx = rnd(b.x, b.x + b.w); }
    if (side === 'B') { sy = b.y + b.h; sx = rnd(b.x, b.x + b.w); }
    this.indicators.add(sx, sy);
    this._defer(700, () => {
      const a   = Math.atan2(hy - sy, hx - sx);
      const spd = 195 + clamp(score / 250, 0, 85);
      this.pool.spawn({ x: sx, y: sy,
        vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
        r: 8, color: '#ff4400', life: 6 });
    });
  }

  // ── Pattern F: Wall + Gap ───────────────────────────────────────
  _wallGap() {
    const b       = this._bnd();
    const fromTop = Math.random() > 0.5;
    const spd     = 148 + clamp(score / 350, 0, 60);
    const step    = 28;
    const cols    = Math.floor(b.w / step);

    // Always 2 adjacent gaps so wall is guaranteedly dodgable
    // Gap cluster can be anywhere across the full width
    const gapStart = Math.floor(Math.random() * (cols - 2));
    const gaps     = new Set([gapStart, gapStart + 1]);

    const wallY  = fromTop ? b.y : b.y + b.h;
    const vyDir  = fromTop ? spd : -spd;

    // Long indicator — 1.5s warning (wall fires after 1.5s)
    for (let i = 0; i < cols; i++) {
      if (gaps.has(i)) continue;
      this.indicators.add(b.x + i * step + step / 2, wallY, 1.5);
    }

    this._defer(1500, () => {
      for (let i = 0; i < cols; i++) {
        if (gaps.has(i)) continue;
        this.pool.spawn({
          x: b.x + i * step + step / 2, y: wallY,
          vx: 0, vy: vyDir,
          r: step / 2 - 2, color: '#aa44ff', life: 6
        });
      }
    });
  }
}

// ═══════════════════════════════════════════════════════════════════
// GAME DIRECTOR
// ═══════════════════════════════════════════════════════════════════
class GameDirector {
  constructor() {
    this.clock      = new LoopClock(60);
    this.pool       = new BulletPool(900);
    this.particles  = new Particles();
    this.indicators = new IndicatorSystem();

    this.hx = 0; this.hy = 0;   // heart position
    this.iframes   = 0;          // seconds remaining
    this.IFRAME_DUR = 1.6;

    // ── Register hells (add more as built) ─────────────────────────
    this.hells = [
      new DodgeHell(this),
      // ShieldHell, StringHell, GravityHell … added each session
    ];
    this.hellIdx     = 0;
    this.currentHell = this.hells[0];

    this.state      = 'MENU';   // MENU | PLAYING | DEAD
    this.flashAlpha = 0;
    this._lastHellN = 0;        // tracks how many hell transitions have fired
  }

  // ── Start / Restart ─────────────────────────────────────────────
  start() {
    score              = 0;
    this._lastHellN    = 0;
    this.clock         = new LoopClock(60);
    this.clock.pool    = this.pool; // give clock access for future use
    this.pool.clear();
    this.particles.list.length  = 0;
    this.indicators.list.length = 0;
    this.iframes   = 0;
    this.flashAlpha = 0;

    const W = canvas.width, H = canvas.height;
    this.hx = W / 2; this.hy = H / 2;

    this.hellIdx     = 0;
    this.currentHell = this.hells[0];
    this.currentHell.enter();
    this.state = 'PLAYING';
  }

  // ── Hell Transition ─────────────────────────────────────────────
  _transition() {
    this.currentHell.exit();
    this.hellIdx     = (this.hellIdx + 1) % this.hells.length;
    this.currentHell = this.hells[this.hellIdx];
    this.currentHell.enter();
    this.flashAlpha  = 1;       // white flash on transition
  }

  // ── Constrain heart to boundary ─────────────────────────────────
  _constrain() {
    const b = this.currentHell.boundary;
    if (!b) return;
    this.hx = clamp(this.hx, b.x + HEART_R, b.x + b.w - HEART_R);
    this.hy = clamp(this.hy, b.y + HEART_R, b.y + b.h - HEART_R);
  }

  // ── Update ──────────────────────────────────────────────────────
  update(dt) {
    if (this.state !== 'PLAYING') return;
    const W = canvas.width, H = canvas.height;

    // Passive score + hell gating
    score += SCORE_PER_SEC * dt;
    const hellN = Math.floor(score / HELL_SCORE_STEP);
    if (hellN > this._lastHellN) {
      this._lastHellN = hellN;
      this._transition();
    }

    // Clock
    this.clock.update(dt);
    if (this.clock.dead) {
      this.state = 'DEAD';
      this.particles.burst(this.hx, this.hy, '#ff3333', 28, 340);
      return;
    }

    // iFrames
    if (this.iframes > 0) this.iframes -= dt;

    // Heart movement (standard WASD + Shift focus)
    const focused = Keys['ShiftLeft'] || Keys['ShiftRight'];
    const spd     = BASE_SPEED * (focused ? FOCUS_MULT : 1);
    if (Keys['KeyA'] || Keys['ArrowLeft'])  this.hx -= spd * dt;
    if (Keys['KeyD'] || Keys['ArrowRight']) this.hx += spd * dt;
    if (Keys['KeyW'] || Keys['ArrowUp'])    this.hy -= spd * dt;
    if (Keys['KeyS'] || Keys['ArrowDown'])  this.hy += spd * dt;
    this._constrain();

    // Hell logic
    this.currentHell.update(dt);

    // Bullet collision
    const hit = this.pool.update(
      dt, this.hx, this.hy, this.clock,
      this.iframes > 0, this.currentHell.cfg
    );
    if (hit) {
      this.iframes = this.IFRAME_DUR;
      this.particles.burst(this.hx, this.hy, this.currentHell.heartColor, 16, 220);
    }

    this.particles.update(dt);
    this.indicators.update(dt);

    // Flash decay
    if (this.flashAlpha > 0) this.flashAlpha = Math.max(0, this.flashAlpha - dt * 3);
  }

  // ── Draw ────────────────────────────────────────────────────────
  draw(ctx) {
    const W = canvas.width, H = canvas.height;
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, W, H);

    if (this.state === 'MENU') { this._drawMenu(ctx, W, H); return; }
    if (this.state === 'DEAD') { this._drawDead(ctx, W, H);  return; }

    // Hell-specific draw (boundary box etc.)
    this.currentHell.draw(ctx);

    // Bullets → indicators → particles (layering order)
    this.pool.draw(ctx);
    this.indicators.draw(ctx);
    this.particles.draw(ctx);

    // Heart (flicker during iframes)
    const show = this.iframes <= 0 || Math.floor(this.iframes * 9) % 2 === 0;
    if (show) {
      drawHeart(ctx, this.hx, this.hy, HEART_R * 1.55,
        this.currentHell.heartColor, this.currentHell.heartUpsideDown);
    }

    // Graze ring (outer, blue) — always visible, brighter in focus mode
    // Lethal hitbox ring (inner, white) is drawn inside drawHeart at HEART_R
    const focused = Keys['ShiftLeft'] || Keys['ShiftRight'];
    ctx.beginPath();
    ctx.arc(this.hx, this.hy, GRAZE_R, 0, TWO_PI);
    ctx.strokeStyle = focused ? 'rgba(60,140,255,0.70)' : 'rgba(60,120,255,0.28)';
    ctx.lineWidth   = focused ? 1.5 : 1;
    ctx.stroke();

    // HUD
    this.clock.draw(ctx, W);
    this._drawHUD(ctx, W, H);

    // Hell-transition white flash
    if (this.flashAlpha > 0) {
      ctx.fillStyle = `rgba(255,255,255,${this.flashAlpha * 0.45})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  _drawHUD(ctx, W, H) {
    const sc   = Math.floor(score);
    const hell = this.hellIdx + 1;

    // Score — large, bright, bottom-centre
    ctx.textAlign  = 'center';
    ctx.font       = 'bold 18px "Courier New"';
    ctx.fillStyle  = '#ffffff';
    ctx.shadowBlur = 8; ctx.shadowColor = '#4488ff';
    ctx.fillText(sc.toString().padStart(6, '0'), W / 2, H - 30);
    ctx.shadowBlur = 0;

    // Sub-label
    ctx.font      = '10px "Courier New"';
    ctx.fillStyle = '#555';
    ctx.fillText('SCORE', W / 2 - 52, H - 30);
    ctx.fillText('HELL  ' + hell, W / 2 + 22, H - 30);

    ctx.textAlign = 'left';
  }

  _drawMenu(ctx, W, H) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 30px "Courier New"';
    ctx.shadowBlur = 22; ctx.shadowColor = '#ff3333';
    ctx.fillStyle  = '#fff';
    ctx.fillText('✦  INFINITE HEART  ✦', W/2, H/2 - 44);
    ctx.shadowBlur = 0;
    ctx.font = '13px "Courier New"'; ctx.fillStyle = '#aaa';
    ctx.fillText('PRESS  SPACE  OR  ENTER  TO  START', W/2, H/2 + 6);
    ctx.font = '10px "Courier New"'; ctx.fillStyle = '#444';
    ctx.fillText('WASD — MOVE   |   SHIFT — FOCUS MODE   |   GRAZE → +1s   |   HIT → −6s', W/2, H/2 + 32);
    ctx.fillText('HELL CHANGES EVERY  ' + HELL_SCORE_STEP + '  SCORE', W/2, H/2 + 50);
    ctx.textAlign = 'left';
  }

  _drawDead(ctx, W, H) {
    this.particles.draw(ctx);
    ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 26px "Courier New"';
    ctx.shadowBlur = 18; ctx.shadowColor = '#ff0000';
    ctx.fillStyle  = '#ff3333';
    ctx.fillText('— TIME IS UP —', W/2, H/2 - 32);
    ctx.shadowBlur = 0;
    ctx.font = '14px "Courier New"'; ctx.fillStyle = '#aaa';
    ctx.fillText('SCORE:  ' + Math.floor(score), W/2, H/2 + 8);
    ctx.fillText('REACHED HELL  ' + (this.hellIdx + 1), W/2, H/2 + 30);
    ctx.font = '11px "Courier New"'; ctx.fillStyle = '#555';
    ctx.fillText('PRESS SPACE OR ENTER TO RETRY', W/2, H/2 + 58);
    ctx.textAlign = 'left';
  }
}

// ─── Boot ───────────────────────────────────────────────────────────
const director = new GameDirector();

window.addEventListener('keydown', e => {
  if ((e.code === 'Space' || e.code === 'Enter') && director.state !== 'PLAYING') {
    director.start();
  }
});

let _lt = 0;
function loop(ts) {
  const dt = Math.min((ts - _lt) / 1000, 0.05); // cap at 50ms (handles tab switch)
  _lt = ts;
  director.update(dt);
  director.draw(ctx);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
